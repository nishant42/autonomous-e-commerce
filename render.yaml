# Paid, persistent recruiter deployment. Review Render's quote before applying.
# Configure the backend first, then the storefront and engine (see deployment/README.md).
databases:
  - name: halden-db
    region: frankfurt
    plan: basic-256mb
    databaseName: halden
    user: halden
    ipAllowList: []
services:
  - type: web
    name: halden-backend
    runtime: node
    region: frankfurt
    plan: standard
    buildCommand: cd shop && npm ci --include=dev && npm run build --workspace=@dtc/backend
    startCommand: sh deployment/start-backend.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: halden-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false
  - type: web
    name: halden-storefront
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: cd shop && npm ci --include=dev && npm run build --workspace=@dtc/storefront
    startCommand: sh deployment/start-storefront.sh
    healthCheckPath: /dk/store
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_MEDUSA_BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_REGION
        value: dk
  - type: web
    name: halden-agents
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r deployment/requirements.txt
    startCommand: python deployment/serve.py
    healthCheckPath: /healthz
    disk:
      name: engine-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENGINE_DB
        value: /var/data/engine.db
      - key: ENGINE_MODEL_PROVIDER
        value: rules_only
      - key: OMP_NUM_THREADS
        value: '1'
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: VIEWER_PASSWORD
        generateValue: true
      - key: OPERATOR_PASSWORD
        generateValue: true
      - key: SHOP_PUBLIC_URL
        sync: false
      - key: ENGINE_PUBLIC_URL
        sync: false
      - key: MEDUSA_URL
        sync: false
      - key: MEDUSA_EMAIL
        sync: false
      - key: MEDUSA_PASSWORD
        sync: false
